server {
    listen 80;
    server_name coffee.bytebard.cloud;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name coffee.bytebard.cloud;
    proxy_http_version 1.1;

    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:3070;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 없으면 관리자 POST가 403으로 막힌다 (test/auth.test.ts 참고)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/coffee.bytebard.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee.bytebard.cloud/privkey.pem;
}
